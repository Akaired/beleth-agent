[project]
name = "beleth-agent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.44.0",
    "httpx>=0.28",
    "openai>=1.60.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "tzdata>=2025.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: hits real external APIs (Alpaca paper trading / Supabase) — needs .env credentials.",
]
