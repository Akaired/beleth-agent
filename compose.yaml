# Resident deployment for the the trading host (Ubuntu bare metal, Docker).
# restart: unless-stopped IS the process supervision — a crashed or rebooted host
# brings the agent back without manual action. No ports: the agent is outbound-only.
services:
  beleth-agent:
    build:
      context: .
      args:
        # Short commit the image was built from — surfaced in the backoffice Host panel.
        # Pass on the command line: `GIT_SHA=$(git rev-parse --short HEAD) docker compose up -d --build`.
        GIT_SHA: ${GIT_SHA:-}
    image: beleth-agent:latest
    container_name: beleth-agent
    # Stable name for the host telemetry (platform.node() would otherwise be the
    # random container id).
    hostname: trading-host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Label shown on the backoffice Host panel.
      BELETH_HOST_LABEL: the trading host
    stop_grace_period: 30s
    # P6 — cap Docker's own json-file logs so an unattended host cannot fill its disk.
    # These are still discarded on every `up --build` / recreate; the durable record is
    # Supabase, and the human-readable narrative is mirrored to the logs volume below.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # P6 — hard memory ceiling: a leak becomes a clean OOM kill (OOMKilled=true,
    # RestartCount climbs, restart: unless-stopped brings it back) instead of the agent
    # slowly starving the the trading host. Day-1 steady state was ~80 MiB; 512 MiB is wide headroom.
    # Compose v2 applies deploy.resources.limits for `docker compose up` (no swarm needed).
    deploy:
      resources:
        limits:
          memory: 512M
    # P6 — mirror the runner's stdout/stderr to a rotating file that OUTLIVES a container
    # recreation, so the ~1 h of narrative lost to every early rebuild cannot happen again.
    volumes:
      - beleth-logs:/app/logs

volumes:
  beleth-logs:
