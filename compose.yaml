# Resident deployment for a private Linux host (Docker).
# restart: unless-stopped IS the process supervision — a crashed or rebooted host
# brings the agent back without manual action. No ports: the agent is outbound-only.
services:
  beleth-agent:
    build:
      context: .
      args:
        # Short commit the image was built from — surfaced in the backoffice Host panel.
        # Pass on the command line: `GIT_SHA=$(git rev-parse --short HEAD) docker compose up -d --build`.
        GIT_SHA: ${GIT_SHA:-}
    image: beleth-agent:latest
    container_name: beleth-agent
    # Stable name for the host telemetry (platform.node() would otherwise be the
    # random container id).
    hostname: beleth-agent
    restart: unless-stopped
    # Deliberately NOT `env_file: .env`. That file also holds SUPABASE_ACCESS_TOKEN — a
    # database-admin PAT used only by the local migration runner — plus the webapp's
    # RESEND_API_KEY and AIML_API_KEY. None of the three is read by anything in this
    # image, and a container should not hold a credential it cannot use. Compose still
    # reads .env to resolve the interpolations below, so nothing changes about how the
    # host is configured; only what crosses into the container narrows.
    #
    # `:?` on the required values means a missing secret fails `compose up` loudly
    # instead of starting an agent that cannot reach its broker.
    environment:
      ALPACA_API_KEY: ${ALPACA_API_KEY:?set ALPACA_API_KEY in .env}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:?set ALPACA_SECRET_KEY in .env}
      ALPACA_BASE_URL: ${ALPACA_BASE_URL:-}
      ALPACA_HTTP_TIMEOUT_SECONDS: ${ALPACA_HTTP_TIMEOUT_SECONDS:-}
      OPENROUTER_KEY: ${OPENROUTER_KEY:?set OPENROUTER_KEY in .env}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      # Secondary LLM provider. Optional: the decision layer runs on the primary alone.
      LLM_FALLBACK_KEY: ${LLM_FALLBACK_KEY:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      # Service-role credentials: the agent is the only writer of the decision log.
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY in .env}
      AGENT_VERSION: ${AGENT_VERSION:-dev}
      # Label shown on the backoffice Host panel.
      BELETH_HOST_LABEL: agent-host
    stop_grace_period: 30s
    # Cap Docker's own json-file logs so an unattended host cannot fill its disk.
    # These are still discarded on every `up --build` / recreate; the durable record is
    # Supabase, and the human-readable narrative is mirrored to the logs volume below.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Hard memory ceiling: a leak becomes a clean OOM kill (OOMKilled=true, RestartCount
    # climbs, restart: unless-stopped brings it back) instead of the agent slowly starving
    # the host. Steady state is well under 100 MiB; 512 MiB is wide headroom.
    # Compose v2 applies deploy.resources.limits for `docker compose up` (no swarm needed).
    deploy:
      resources:
        limits:
          memory: 512M
    # Mirror the runner's stdout/stderr to a rotating file that OUTLIVES a container
    # recreation, so the diagnostic narrative is not lost on every rebuild.
    volumes:
      - beleth-logs:/app/logs

volumes:
  beleth-logs:
